[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-relay-python"
version = "0.1.0"
description = "WebSocket relay for remote ADB, compatible with adb-relay-jvm and adb-relay-android (spec v1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]

[project.urls]
Source = "https://github.com/aioue/adb-relay-python"
Specification = "https://github.com/AndroidGradleTools/adb-relay-jvm/blob/main/prompts/specs.md"

[project.scripts]
adb-relay = "adb_relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
